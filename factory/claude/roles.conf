# PROPRE À CLAUDE CODE : outils, modèle et effort de chaque rôle de factory/prompts/ (PRD 006, D-60).
# Lu seulement par factory/sync-claude.sh, qui en tire les enveloppes .claude/agents/<rôle>.md ; un autre outil l'ignore et traduit, s'il le faut,
# ces valeurs dans sa propre configuration. Les prompts restent indépendants de l'outil : leur en-tête ne porte que name, description et skills.
#
# Une ligne par rôle : <rôle> | <outils> | <modèle> | <effort>
#   rôle    : le name: d'un prompt de factory/prompts/ (minuscules, chiffres, tirets) ; une seule entrée par rôle, une entrée par prompt à name:.
#   outils  : noms d'outils de Claude Code séparés par des virgules, recopiés dans cet ordre. Un relecteur (code-reviewer-conformite, -qualite,
#             -securite) ne reçoit jamais Write, Edit, MultiEdit ni NotebookEdit, même s'ils sont écrits ici. Aucune clé de configuration ne les règle.
#   modèle  : vide = AGENT_MODELE (.factory.conf, défaut sonnet) ; effort : low, medium, high, xhigh, max, ou vide = AGENT_EFFORT (défaut medium).
#             Pour un relecteur, AGENT_MODELE_<RÔLE> et AGENT_EFFORT_<RÔLE> l'emportent sur cette entrée.
# Lignes vides et lignes commençant par # ignorées. Valeur invalide : code 64 ; incohérence avec les prompts : code 1 ; rien n'est alors écrit.
# Ce fichier fait partie de factory/ et est remplacé à chaque mise à jour : un réglage local durable passe par .factory.conf ou .factory.local.conf.

spec-writer              | Read, Write, Glob, Grep             |        |
developer                | Read, Write, Edit, Glob, Grep, Bash |        |
code-reviewer            | Read, Glob, Grep, Bash              |        |
code-reviewer-conformite | Read, Glob, Grep, Bash              | sonnet | medium
code-reviewer-qualite    | Read, Glob, Grep, Bash              | sonnet | medium
code-reviewer-securite   | Read, Glob, Grep, Bash              | opus   | high
