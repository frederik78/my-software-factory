# Configuration de la factory pour ce projet (versionnée, commune à l'équipe).
# Valeurs personnelles : .factory.local.conf (mêmes clés, ignoré par git), qui l'emporte sur ce fichier ;
# les variables d'environnement FACTORY_<CLÉ> (ex. FACTORY_MAX_ITERATIONS_REVUE=3) l'emportent sur les deux.
# Format : une ligne CLÉ=valeur, valeur prise telle quelle (sans guillemets) ; lignes vides et commentaires (#) ignorés.
# Ce fichier n'est JAMAIS exécuté (ni sourcé) : aucune syntaxe shell n'y a d'effet. Valeur effective : scripts/config-factory.sh

# Nombre maximal d'allers-retours développeur <-> relecteur pour une issue (/deliver, et corrections après /code-review).
# Au-delà, la session s'arrête, envoie une notification (si configurée) et vous remonte le blocage. Entier >= 1.
MAX_ITERATIONS_REVUE=5

# Notification par courriel quand une issue reste bloquée (scripts/notifier.sh ; essai : scripts/notifier.sh --test).
# NOTIFICATION_COMMANDE : commande d'envoi, découpée en mots sur les espaces (pas de guillemets ni de syntaxe shell). Elle reçoit le
# message complet (en-têtes et corps) sur son entrée standard et le destinataire en dernier argument. Exemples :
#   NOTIFICATION_COMMANDE=msmtp -a gmail        (compte défini dans ~/.msmtprc)
#   NOTIFICATION_COMMANDE=sendmail -t           (lit aussi les en-têtes To/From)
#   NOTIFICATION_COMMANDE=mail -t
#   NOTIFICATION_COMMANDE=/chemin/vers/envoi-api.sh   (petit script qui appelle une API avec curl)
# Les SECRETS (mot de passe SMTP, clé d'API) restent dans la configuration de l'outil d'envoi (~/.msmtprc, trousseau du système),
# jamais dans ce fichier ni dans le dépôt. Vide = pas de notification.
NOTIFICATION_COMMANDE=
# Adresse du destinataire, à renseigner de préférence dans .factory.local.conf (ex. moi@example.com). Vide = pas de notification.
NOTIFICATION_DESTINATAIRE=
# Facultatif : en-tête From (ex. Factory <factory@example.com>).
NOTIFICATION_EXPEDITEUR=
